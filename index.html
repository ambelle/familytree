<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neko Family Tree</title>

<style>
/* KEEP YOUR ORIGINAL CSS — unchanged */
</style>
</head>

<body>

<header>
  <div>
    <h1>Neko Family Tree</h1>
    <div class="sub">Professional graph view · drag to pan · scroll to zoom</div>
  </div>
</header>

<main class="app">

  <aside class="panel">

    <h2>Manage</h2>

    <label>Find</label>
    <input id="search" placeholder="Search name" />

    <div class="stats">
      <div class="chip pink" id="peopleCount">0 people</div>
      <div class="chip blue" id="generationCount">0 gen</div>
      <div class="chip">Root: Thocky</div>
    </div>

    <div class="divider"></div>

    <h2>Add / Replace</h2>
    <label>Parent</label>
    <select id="parentSelect"></select>

    <div class="row">
      <div>
        <label>Slot</label>
        <select id="slotSelect">
          <option value="0">Junior 1</option>
          <option value="1">Junior 2</option>
        </select>
      </div>
      <div>
        <label>Junior</label>
        <input id="juniorName" placeholder="New junior" />
      </div>
    </div>

    <div class="buttons">
      <button id="saveBtn">Save</button>
      <button class="secondary" id="clearBtn">Clear</button>
    </div>

    <div class="divider"></div>

    <h2>Switch</h2>

    <div class="row">
      <div>
        <label>Name A</label>
        <select id="switchA"></select>
      </div>
      <div>
        <label>Name B</label>
        <select id="switchB"></select>
      </div>
    </div>

    <div class="buttons">
      <button id="switchBtn">Switch</button>
      <button class="danger" id="resetBtn">Reset</button>
    </div>

    <div class="divider"></div>

    <h2>Level Check</h2>
    <div id="levelCheck" class="levelBox"></div>

    <div class="msg" id="msg"></div>
    <div class="list" id="dataPreview"></div>

  </aside>

  <section class="tree-stage">

    <div class="toolbar">
      <div class="badge" id="dataStatus">Loading...</div>

      <div class="controlCluster">
        <button id="rootBtn">Root</button>
        <button id="fitMode">Fit</button>
        <button id="plus">+</button>
        <button id="minus">−</button>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <div class="fit-layer" id="fitLayer">
        <div class="canvas" id="canvas">
          <svg id="links"></svg>
        </div>
      </div>
    </div>

  </section>

</main>

<script>

const ROOT="Thocky";

const ORIGINAL_FAMILY={
  "Thocky":["Kaiko","Gillian"],
  "Gillian":["Miffyy","Gill"],
  "Miffyy":["looted","54o88"],
  "54o88":["Mellowdy","Tock"],
  "Tock":["Gwailou","Rushyy"],
  "Gill":["ggill","Heii"],
  "Heii":["ggil","Tocki"],
  "ggil":["8lo8lo8lowme","Exteriority"],
  "Kaiko":["sunshines","Tocky"],
  "Tocky":["Leaw","mabokdy"],
  "mabokdy":["scrabbit",null],
  "Leaw":["Tork","okdy"],
  "okdy":["sunbaedy",null],
  "Tork":["Chageee","Arun"],
  "Chageee":["Afersie",null],
  "Afersie":["wookimo",null],
  "Arun":["Tokk","Seub"],
  "Tokk":["TypeR",null]
};

let family=JSON.parse(localStorage.getItem('family')||JSON.stringify(ORIGINAL_FAMILY));
let characterData={};

function gid(id){return document.getElementById(id)}

function render(){
  gid("dataPreview").textContent=JSON.stringify(family,null,2);
}

async function loadCharacterData(){
  try{
    const r=await fetch('characters.json');
    characterData=await r.json();
    gid("dataStatus").textContent="Loaded";
  }catch{
    gid("dataStatus").textContent="No data";
  }
  render();
}

/* ===== BUTTONS ===== */

gid('saveBtn').onclick=()=>{
  const p=gid('parentSelect').value;
  const name=gid('juniorName').value.trim();
  const slot=+gid('slotSelect').value;

  if(!name)return;

  family[p]=family[p]||[null,null];
  family[p][slot]=name;

  localStorage.setItem('family',JSON.stringify(family));
  render();
};

gid('clearBtn').onclick=()=>{
  const p=gid('parentSelect').value;
  const slot=+gid('slotSelect').value;

  if(family[p]) family[p][slot]=null;

  localStorage.setItem('family',JSON.stringify(family));
  render();
};

gid('switchBtn').onclick=()=>{
  const a=gid('switchA').value;
  const b=gid('switchB').value;

  Object.keys(family).forEach(k=>{
    family[k]=family[k].map(v=>{
      if(v===a)return b;
      if(v===b)return a;
      return v;
    });
  });

  localStorage.setItem('family',JSON.stringify(family));
  render();
};

gid('resetBtn').onclick=()=>{
  if(confirm("Reset?")){
    family=JSON.parse(JSON.stringify(ORIGINAL_FAMILY));
    localStorage.setItem('family',JSON.stringify(family));
    render();
  }
};

/* ===== ZOOM ===== */

gid('fitMode').onclick=()=>{};
gid('rootBtn').onclick=()=>{};
gid('plus').onclick=()=>{};
gid('minus').onclick=()=>{};

loadCharacterData();

</script>

</body>
</html>
