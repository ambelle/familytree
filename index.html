<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Neko Family Tree</title>

<style>
body{margin:0;font-family:Inter,Arial;background:#f9f4ff;overflow:hidden}

header{
  padding:16px 24px;
  font-size:32px;
  font-weight:900;
}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:calc(100vh - 70px);
}

.panel{
  padding:12px;
  overflow:auto;
  border-right:1px solid #eee;
  background:white;
}

.tree{
  position:relative;
  overflow:hidden;
}

.viewport{
  position:absolute;
  inset:0;
  cursor:grab;
}

.canvas{
  position:absolute;
  transform-origin:center;
}

.node{
  position:absolute;
  transform:translate(-50%,-50%);
  width:160px;
  padding:8px;
  border-radius:14px;
  background:white;
  text-align:center;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  border:1px solid #eee;
}

.node img{
  width:52px;height:52px;
}

.name{
  font-size:16px;
  font-weight:900;
}

.meta{
  font-size:12px;
  color:#777;
}

.warn-red{border:2px solid red}
.warn-yellow{border:2px solid orange}

svg{
  position:absolute;
  left:0;top:0;
}

</style>
</head>

<body>

<header>Neko Family Tree</header>

<div class="app">

<div class="panel">
<button id="fit">Fit</button>
<button id="refresh">Refresh</button>
</div>

<div class="tree">
<div class="viewport" id="vp">
<div class="canvas" id="cv"></div>
<svg id="lines"></svg>
</div>
</div>

</div>

<script>
const ROOT="Thocky";

let family = JSON.parse(localStorage.getItem("family")) || {
 "Thocky":["Kaiko","Gillian"],
 "Gillian":["Miffyy","Gill"],
 "Miffyy":["looted","54o88"],
 "54o88":["Mellowdy","Tock"],
 "Tock":["Gwailou","Rushyy"],
 "Gill":["ggill","Hell"],
 "Hell":["ggil","Tocki"],
 "ggil":["8lo8lo8lowme","Exteriority"],
 "Kaiko":["sunshines","Tocky"]
};

let data = {};
let scale=1;
let offsetX=0;
let offsetY=0;

const cv=document.getElementById("cv");
const lines=document.getElementById("lines");
const vp=document.getElementById("vp");

async function load(){
  const r=await fetch("characters.json?"+Date.now());
  data=await r.json();
  render();
}

function getLevel(n){
  return parseInt(data[n]?.level||0);
}

function render(){
  cv.innerHTML="";
  lines.innerHTML="";

  let nodes=[];
  function build(n,d=0){
    nodes.push({n,d});
    (family[n]||[]).forEach(c=>c&&build(c,d+1));
  }
  build(ROOT);

  const centerX=800;
  const centerY=500;

  const rings={};

  nodes.forEach(x=>{
    rings[x.d]=rings[x.d]||[];
    rings[x.d].push(x.n);
  });

  Object.entries(rings).forEach(([d,list])=>{
    const r=120*d;
    list.forEach((name,i)=>{
      const angle=(i/list.length)*Math.PI*2;
      const x=centerX+Math.cos(angle)*r;
      const y=centerY+Math.sin(angle)*r;

      const el=document.createElement("div");
      el.className="node";

      const p=Object.entries(family).find(([k,v])=>v.includes(name))?.[0];
      if(p){
        const pl=getLevel(p);
        const cl=getLevel(name);
        if(cl>pl) el.classList.add("warn-red");
        else if(cl===pl) el.classList.add("warn-yellow");
      }

      el.style.left=x+"px";
      el.style.top=y+"px";

      el.innerHTML=`
        <img src="${data[name]?.image||""}">
        <div class="name">${name}</div>
        <div class="meta">${data[name]?.job||""} Lv${data[name]?.level||""}</div>
      `;

      el.onclick=()=>{
        offsetX = window.innerWidth/2 - x*scale;
        offsetY = window.innerHeight/2 - y*scale;
        updateTransform();
      };

      cv.appendChild(el);

      (family[name]||[]).forEach(c=>{
        if(!c) return;

        const child = nodes.find(n=>n.n===c);
        if(!child) return;

        const cd = child.d;
        const cr = 120*cd;
        const idx = rings[cd].indexOf(c);
        const ca = (idx/rings[cd].length)*Math.PI*2;

        const cx=centerX+Math.cos(ca)*cr;
        const cy=centerY+Math.sin(ca)*cr;

        const line=document.createElementNS("http://www.w3.org/2000/svg","line");
        line.setAttribute("x1",x);
        line.setAttribute("y1",y);
        line.setAttribute("x2",cx);
        line.setAttribute("y2",cy);
        line.setAttribute("stroke","#aaa");

        lines.appendChild(line);
      });
    });
  });

  updateTransform();
}

function updateTransform(){
  cv.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;
  lines.style.transform=cv.style.transform;
}

vp.onwheel=e=>{
  e.preventDefault();
  scale*=e.deltaY>0?0.9:1.1;
  updateTransform();
};

let down=false,sx,sy;

vp.onmousedown=e=>{
  down=true;
  sx=e.clientX-offsetX;
  sy=e.clientY-offsetY;
};

vp.onmousemove=e=>{
  if(!down)return;
  offsetX=e.clientX-sx;
  offsetY=e.clientY-sy;
  updateTransform();
};

vp.onmouseup=()=>down=false;

document.getElementById("fit").onclick=()=>{
  scale=0.6;
  offsetX=0;
  offsetY=0;
  updateTransform();
};

document.getElementById("refresh").onclick=load;

load();
</script>

</body>
</html>
