<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neko Family Tree</title>

<style>
:root{
  --ink:#3b3144;
  --line:#bfa7e8;
}

/* Layout */
body{
  margin:0;
  font-family:Inter,system-ui;
  background:#f9f4ff;
  overflow:hidden;
}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100vh;
}

/* Tree area */
.viewport{
  position:absolute;
  inset:0;
  overflow:auto;
  cursor:grab;
}

.viewport:active{
  cursor:grabbing;
}

.canvas{
  position:relative;
}

.node{
  position:absolute;
  transform:translate(-50%,-50%);
  width:180px;
  min-height:110px;
  background:white;
  border-radius:18px;
  padding:8px;
  text-align:center;
  font-weight:900;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.node.gen0{
  width:200px;
  min-height:120px;
}

.avatarWrap{
  width:60px;
  height:60px;
  margin:auto;
}

.node.gen0 .avatarWrap{
  width:70px;
  height:70px;
}

.avatar{
  max-width:72px;
  max-height:72px;
}

.name{
  font-size:18px;
  margin-top:4px;
}

.meta{
  font-size:11px;
  opacity:.7;
}

/* warnings */
.warn-red{
  border:2px solid red;
}
.warn-yellow{
  border:2px solid orange;
}

/* vacant */
.vacant{
  border:1px dashed #bbb;
  background:#eee;
}

/* lines */
svg{
  position:absolute;
}
</style>
</head>

<body>

<div class="app">
  <div></div>

  <div id="viewport" class="viewport">
    <div id="fitLayer">
      <div id="canvas" class="canvas">
        <svg id="links"></svg>
      </div>
    </div>
  </div>
</div>

<script>
const ROOT="Thocky";

let family = JSON.parse(localStorage.getItem('family')) || {
  "Thocky":["Kaiko","Gillian"]
};

let characterData = {};
let manualScale = null;
let didInitialCenter = false;

const els = {
  canvas: document.getElementById("canvas"),
  links: document.getElementById("links"),
  viewport: document.getElementById("viewport"),
  fitLayer: document.getElementById("fitLayer")
};

/* ---------- LEVEL ---------- */
function getLevel(name){
  const lvl = characterData[name]?.level;
  return lvl ? parseInt(lvl) : null;
}

/* ---------- TREE ---------- */
function childrenOf(n){
  const arr = family[n] || [];
  return [arr[0] || null, arr[1] || null];
}

function buildNode(name, depth=0){
  return {
    name,
    depth,
    children: childrenOf(name).map(c=> c ? buildNode(c, depth+1) : {name:null, depth:depth+1, children:[]})
  };
}

function measure(n){
  const gap = 40;
  const leaf = 180;

  if(!n.children.length){
    n.w = leaf;
    return n.w;
  }

  n.w = Math.max(
    leaf,
    n.children.reduce((a,c)=>a+measure(c),0) + gap*(n.children.length-1)
  );

  return n.w;
}

function place(n,left,depth){
  const levelGap=130;

  n.x = left + n.w/2;
  n.y = 80 + depth*levelGap;

  let cur = left;

  n.children.forEach(c=>{
    place(c,cur,depth+1);
    cur += c.w + 40;
  });
}

function flatten(n,a=[]){
  a.push(n);
  n.children.forEach(c=>flatten(c,a));
  return a;
}

/* ---------- DRAW ---------- */
function drawNode(n){
  const d=document.createElement("div");
  d.className="node gen"+n.depth;

  d.style.left=n.x+"px";
  d.style.top=n.y+"px";

  if(!n.name){
    d.classList.add("vacant");
    d.innerHTML="<div class='name'>Vacant</div>";
    els.canvas.appendChild(d);
    return;
  }

  const data = characterData[n.name] || {};

  const parent = Object.entries(family)
    .find(([p,cs])=>cs.includes(n.name))?.[0];

  if(parent){
    const p = getLevel(parent);
    const c = getLevel(n.name);

    if(p && c){
      if(c > p) d.classList.add("warn-red");
      else if(c === p) d.classList.add("warn-yellow");
    }
  }

  d.innerHTML=`
    <div class="avatarWrap">
      ${data.image ? `<img class="avatar" src="${data.image}">` : "♡"}
    </div>
    <div class="name">${n.name}</div>
    <div class="meta">${data.job || ""} Lv ${data.level || ""}</div>
  `;

  els.canvas.appendChild(d);
}

function drawLink(a,b){
  if(!b.name) return;

  const path = document.createElementNS("http://www.w3.org/2000/svg","line");

  path.setAttribute("x1",a.x);
  path.setAttribute("y1",a.y+50);
  path.setAttribute("x2",b.x);
  path.setAttribute("y2",b.y-50);

  path.setAttribute("stroke","#bfa7e8");
  path.setAttribute("stroke-width","3");

  els.links.appendChild(path);
}

/* ---------- RENDER ---------- */
function render(){
  const root = buildNode(ROOT);

  measure(root);
  place(root,50,0);

  const nodes = flatten(root);

  els.canvas.innerHTML="";
  els.links.innerHTML="";

  nodes.forEach(n=>{
    drawNode(n);
    n.children.forEach(c=>drawLink(n,c));
  });

  fitTree();
}

/* ---------- FIT ---------- */
function fitTree(){
  const w = els.canvas.offsetWidth;
  const h = els.canvas.offsetHeight;
  const vw = els.viewport.clientWidth;
  const vh = els.viewport.clientHeight;

  const auto = Math.min(vw/w, vh/h);

  const defaultZoom = Math.min(Math.max(auto*1.8, 0.5), 1.1);
  const scale = manualScale ?? defaultZoom;

  els.fitLayer.style.transform =
    `translate(20px,20px) scale(${scale})`;

  if(!didInitialCenter){
    didInitialCenter=true;
    els.viewport.scrollLeft = w/4;
    els.viewport.scrollTop = h/10;
  }
}

/* ---------- DATA ---------- */
async function loadData(){
  const r = await fetch("characters.json?"+Date.now());
  characterData = await r.json();
  render();
}

/* ---------- PAN ---------- */
let isDown=false, startX, startY, scrollLeft, scrollTop;

els.viewport.addEventListener("mousedown",e=>{
  isDown=true;
  startX=e.pageX;
  startY=e.pageY;
  scrollLeft=els.viewport.scrollLeft;
  scrollTop=els.viewport.scrollTop;
});

els.viewport.addEventListener("mouseup",()=>isDown=false);
els.viewport.addEventListener("mouseleave",()=>isDown=false);

els.viewport.addEventListener("mousemove",e=>{
  if(!isDown) return;
  els.viewport.scrollLeft = scrollLeft - (e.pageX - startX);
  els.viewport.scrollTop = scrollTop - (e.pageY - startY);
});

/* ---------- INIT ---------- */
loadData();
</script>

</body>
</html>
